<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>利用規約（ドラフト）— MedMatch</title><link rel="stylesheet" href="./styles.css"></head><body><main class="page"><article class="detail-main"><p class="tag orange">DRAFT — LEGAL REVIEW REQUIRED</p><h1 class="detail-title">利用規約（運用前ドラフト）</h1><section class="detail-section"><h2>サービスの目的</h2><p>MedMatchは、医学生による病院情報の閲覧・応募と、病院による募集掲載・学生へのスカウト等を支援するプラットフォームです。</p></section><section class="detail-section"><h2>アカウント</h2><p>利用者は正確な情報を登録し、自身の認証情報を適切に管理します。病院アカウントは運営確認後に一部機能が利用可能になります。</p></section><section class="detail-section"><h2>禁止事項</h2><p>虚偽登録、なりすまし、不正アクセス、嫌がらせ、取得情報の目的外利用、サービス運営を妨害する行為等を禁止します。</p></section><p><a href="./">MedMatchへ戻る</a></p></article></main></body></html>
