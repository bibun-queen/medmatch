<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="医学生と病院をつなぐ公募・採用プラットフォーム MedMatch">
  <title>MedMatch | 医学生と病院をつなぐ公募プラットフォーム</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="top">
    <div class="utility">
      <div class="wrap utility-inner">
        <span>医学生と病院をつなぐ公募・採用支援プラットフォーム</span>
        <div class="role-switch" aria-label="表示切替">
          <button data-role="student" class="active">医学生</button>
          <button data-role="hospital">病院</button>
          <button data-role="admin">運営</button>
        </div>
      </div>
    </div>
    <div class="wrap brandbar">
      <button class="brand" id="brandHome" type="button">
        <span class="mark">M</span>
        <span><b>MedMatch</b><small>Medical Student × Hospital Matching Platform</small></span>
      </button>
      <div class="head-actions">
        <button class="btn">ヘルプ</button>
        <button class="btn primary" id="mypageBtn">マイページ</button>
      </div>
    </div>
    <nav class="mainnav" id="topNav">
      <div class="wrap nav-inner">
        <button data-page="home" class="active">求人を探す</button>
        <button data-page="favorites">お気に入り</button>
        <button data-page="applications">応募管理</button>
        <button data-page="profile">プロフィール</button>
      </div>
    </nav>
  </header>

  <!-- JSが失敗しても、ここまでは必ず表示される -->
  <main id="app">
    <section class="hero">
      <div class="wrap">
        <p class="eyebrow">医学生向け</p>
        <h1>研修先・病院見学・実習の公募を探す</h1>
        <p class="lead">勤務地、診療科、学年、卒業年度などから公募情報を検索できます。</p>

        <section class="searchbox">
          <div class="searchbox-head">
            <h2>求人・研修情報検索</h2>
            <span>公開中 <b>128</b> 件</span>
          </div>
          <form id="jobSearchForm" class="search-grid">
            <label class="field span6">
              <span>フリーワード</span>
              <input name="q" placeholder="病院名・診療科・研修プログラムなど">
            </label>
            <label class="field span3">
              <span>募集区分</span>
              <select name="type">
                <option value="">すべて</option>
                <option>初期研修</option>
                <option>病院見学</option>
                <option>実習・インターン</option>
              </select>
            </label>
            <label class="field span3">
              <span>診療科</span>
              <select name="specialty">
                <option value="">すべて</option>
                <option>総合診療</option><option>救急</option><option>内科</option><option>外科</option>
                <option>小児科</option><option>産婦人科</option><option>精神科</option><option>麻酔科</option>
              </select>
            </label>

            <div class="field span12">
              <span>勤務地</span>
              <div class="area-row">
                <label><input type="checkbox" name="area" value="北海道"><span>北海道</span></label>
                <label><input type="checkbox" name="area" value="東北"><span>東北</span></label>
                <label><input type="checkbox" name="area" value="関東"><span>関東</span></label>
                <label><input type="checkbox" name="area" value="東海"><span>東海</span></label>
                <label><input type="checkbox" name="area" value="近畿"><span>近畿</span></label>
                <label><input type="checkbox" name="area" value="中国"><span>中国</span></label>
                <label><input type="checkbox" name="area" value="四国"><span>四国</span></label>
                <label><input type="checkbox" name="area" value="九州・沖縄"><span>九州・沖縄</span></label>
              </div>
            </div>

            <label class="field span3">
              <span>学年</span>
              <select name="year">
                <option value="">指定なし</option>
                <option value="1">1年</option><option value="2">2年</option><option value="3">3年</option>
                <option value="4">4年</option><option value="5">5年</option><option value="6">6年</option>
              </select>
            </label>
            <label class="field span3">
              <span>卒業予定年度</span>
              <select name="grad">
                <option value="">指定なし</option>
                <option>2027</option><option>2028</option><option>2029</option><option>2030</option>
                <option>2031</option><option>2032</option>
              </select>
            </label>
            <div class="span6 search-actions">
              <button type="reset" class="btn">条件をクリア</button>
              <button type="submit" class="btn navy">この条件で検索</button>
            </div>
          </form>
        </section>
      </div>
    </section>

    <div class="wrap two-col">
      <aside class="side">
        <div class="side-title">医学生マイページ</div>
        <button data-page="home" class="active">求人検索</button>
        <button data-page="saved">保存した検索条件</button>
        <button data-page="favorites">お気に入り</button>
        <div class="side-label">応募・連絡</div>
        <button data-page="applications">応募管理</button>
        <button data-page="scouts">スカウト</button>
        <button data-page="messages">メッセージ</button>
        <div class="side-label">登録情報</div>
        <button data-page="profile">プロフィール</button>
      </aside>

      <section class="content">
        <div class="pagehead">
          <div><h2>新着公募</h2><p>直近に掲載された公募情報です。</p></div>
        </div>
        <div id="jobList"></div>
      </section>
    </div>
  </main>

  <div id="toast" class="toast" aria-live="polite"></div>

  <footer>
    <div class="wrap footer-inner">
      <span>© 2026 MedMatch</span>
      <span>利用規約　プライバシーポリシー　お問い合わせ</span>
    </div>
  </footer>

  <script src="./app.js" defer></script>
</body>
</html>
