window.__MEDMATCH_STARTED__ = true;

const CONFIG = {
  supabaseUrl: "https://tbahaqcctejyynhxjbch.supabase.co",
  supabasePublishableKey: "sb_publishable_3DkEsr95r70rg11LcOjQqQ_Axz00edY",
  appName: "MedMatch",

const root = document.getElementById("root");
const toastEl = document.getElementById("toast");

const state = {
  supabase: null,
  supabaseReady: false,
  connectionError: "",
  session: null,
  profile: null,
  route: parseRoute(),
  filters: { keyword: "", prefecture: "", specialty: "", jobType: "" },
  studentSearchFilters: { graduationYear: "", area: "", specialty: "", university: "" },
  jobs: [],
  activeDashTab: "overview",
  authRecovery: new URLSearchParams(location.search).get("auth") === "recovery",
  resetEmailSent: false,
  recoveryError: new URLSearchParams(location.search).get("error_description") || (new URLSearchParams(location.search).has("error") ? "再設定リンクの認証に失敗しました。" : ""),
};

const PREFECTURES = ["北海道","青森県","岩手県","宮城県","秋田県","山形県","福島県","茨城県","栃木県","群馬県","埼玉県","千葉県","東京都","神奈川県","新潟県","富山県","石川県","福井県","山梨県","長野県","岐阜県","静岡県","愛知県","三重県","滋賀県","京都府","大阪府","兵庫県","奈良県","和歌山県","鳥取県","島根県","岡山県","広島県","山口県","徳島県","香川県","愛媛県","高知県","福岡県","佐賀県","長崎県","熊本県","大分県","宮崎県","鹿児島県","沖縄県"];
const SPECIALTIES = ["内科","外科","救急科","小児科","産婦人科","精神科","皮膚科","眼科","耳鼻咽喉科","整形外科","脳神経外科","泌尿器科","放射線科","麻酔科","病理診断科","総合診療科"];
const JOB_KINDS = [
  { value:"visit", label:"病院見学" },
  { value:"residency", label:"初期研修" },
  { value:"briefing", label:"イベント・説明会" }
];
function jobKindLabel(value){ return JOB_KINDS.find(x=>x.value===value)?.label || value || "募集"; }
function jobKindOptions(selected="", placeholder="指定なし"){
  return `<option value="">${placeholder}</option>` + JOB_KINDS.map(x=>`<option value="${x.value}" ${x.value===selected?"selected":""}>${x.label}</option>`).join("");
}

function escapeHtml(value = "") {
  return String(value).replace(/[&<>'"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
}
function jobDeadlineExpired(deadline) {
  if (!deadline) return false;
  const todayJst = new Intl.DateTimeFormat("sv-SE", {timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
  return String(deadline).slice(0,10) < todayJst;
}
function jobDeadlineLabel(deadline) {
  return deadline ? escapeHtml(String(deadline).slice(0,10).replace(/-/g,"/")) : "指定なし";
}
function jobCapacityLabel(capacity) {
  return Number.isInteger(Number(capacity)) && Number(capacity)>0 ? `${escapeHtml(capacity)}名` : "指定なし";
}
function jobFormValues(form) {
  const f = new FormData(form);
  const title = String(f.get("title")||"").trim();
  const description = String(f.get("description")||"").trim();
  const kind = String(f.get("kind")||"").trim();
  const deadline = String(f.get("application_deadline")||"").trim();
  const cap = String(f.get("capacity")||"").trim();
  const year = String(f.get("graduation_year")||"").trim();
  if (!title || !description || !JOB_KINDS.some(x=>x.value===kind)) throw new Error("募集名・募集区分・募集内容を入力してください。");
  if (deadline && !/^\d{4}-\d{2}-\d{2}$/.test(deadline)) throw new Error("応募締切の日付を確認してください。");
  if (cap && (!/^\d+$/.test(cap) || Number(cap)<1 || !Number.isSafeInteger(Number(cap)))) throw new Error("募集人数は1以上の整数で入力してください。");
  if (year && (!/^\d{4}$/.test(year) || Number(year)<2026 || Number(year)>2040)) throw new Error("対象卒業年を確認してください。");
  return {title,kind,graduation_year:year?Number(year):null,description,application_deadline:deadline||null,capacity:cap?Number(cap):null};
}
function fmtDate(value) {
  if (!value) return "—";
  const d = new Date(value);
  if (Number.isNaN(d.getTime())) return escapeHtml(value);
  return new Intl.DateTimeFormat("ja-JP", { year:"numeric", month:"2-digit", day:"2-digit" }).format(d);
}

function fmtAuditTime(value) {
  if (!value) return "—";
  const d = new Date(value);
  if (Number.isNaN(d.getTime())) return "—";
  return new Intl.DateTimeFormat("ja-JP", {
    timeZone: "Asia/Tokyo", year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit"
  }).format(d);
}
function parseRoute() {
  const raw = location.hash.replace(/^#\/?/, "");
  const parts = raw.split("/").filter(Boolean);
  return { parts, name: parts[0] || "home" };
}
function optionList(values, selected = "", placeholder = "指定なし") {
  return `<option value="">${placeholder}</option>` + values.map(v => `<option value="${escapeHtml(v)}" ${v===selected?"selected":""}>${escapeHtml(v)}</option>`).join("");
}
function toast(message) {
  toastEl.textContent = message;
  toastEl.classList.add("show");
  setTimeout(() => toastEl.classList.remove("show"), 2600);
}
function dbError(error, fallback="処理に失敗しました") {
  console.error(error);
  toast(error?.message || fallback);
}

async function init() {
  render();
  try {
    const { createClient } = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
    if (!CONFIG.supabaseUrl || CONFIG.supabaseUrl.includes("YOUR_PROJECT") || !CONFIG.supabasePublishableKey || CONFIG.supabasePublishableKey.includes("REPLACE_ME")) {
      throw new Error("config.js に Supabase の接続情報が設定されていません。");
    }
    state.supabase = createClient(CONFIG.supabaseUrl, CONFIG.supabasePublishableKey, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });
    const { data: { session }, error } = await state.supabase.auth.getSession();
    if (error && !state.authRecovery) throw error;
    if (error) state.recoveryError = error.message || "再設定リンクを確認できませんでした。";
    state.session = session;
    state.supabaseReady = true;
    if (state.authRecovery) {
      // Supabase may return tokens or a PKCE code: let the SDK process them first,
      // then remove them from the browser address before showing the form.
      history.replaceState(null, "", `${location.pathname}?auth=recovery#/reset-password`);
    }
    await loadOwnProfile();
    state.supabase.auth.onAuthStateChange((event, sessionNow) => {
      if (event === "PASSWORD_RECOVERY") {
        state.authRecovery = true;
        state.recoveryError = "";
        history.replaceState(null, "", `${location.pathname}?auth=recovery#/reset-password`);
      }
      // Supabase advises not to await client queries inside its auth callback.
      setTimeout(async () => {
        state.session = sessionNow;
        await loadOwnProfile();
        render();
      }, 0);
    });
  } catch (error) {
    state.connectionError = error?.message || "Supabaseへの接続に失敗しました。";
    console.error(error);
  }
  await loadPublicJobs();
  render();
}

async function loadOwnProfile() {
  state.profile = null;
  if (!state.supabase || !state.session?.user?.id) return;
  const { data, error } = await state.supabase.from("profiles").select("*").eq("id", state.session.user.id).maybeSingle();
  if (error) console.warn("profile load", error);
  state.profile = data || null;
}

async function loadPublicJobs() {
  if (!state.supabaseReady) { state.jobs = []; return; }
  const { data, error } = await state.supabase
    .from("job_postings")
    .select("id,hospital_id,title,kind,graduation_year,description,application_deadline,capacity,status,published_at,created_at,hospitals(id,name,prefecture,city,status)")
    .eq("status", "published")
    .order("published_at", { ascending:false, nullsFirst:false })
    .order("created_at", { ascending:false })
    .limit(100);
  if (error) { console.warn(error); state.jobs = []; return; }
  state.jobs = data || [];
}

async function sendPasswordReset(e) {
  e.preventDefault();
  if (!state.supabase) return toast("Supabaseに接続できていません");
  const form=e.currentTarget;
  const email=String(new FormData(form).get("email")||"").trim();
  const submit=form.querySelector('button[type="submit"]');
  if (submit) submit.disabled=true;
  // The callback URL must be registered in Supabase Auth > URL Configuration.
  const redirectTo=`${location.origin}${location.pathname}?auth=recovery`;
  try {
    const {error}=await state.supabase.auth.resetPasswordForEmail(email,{redirectTo});
    if (error) throw error;
    state.resetEmailSent=true;
    render();
  } catch(error) {
    dbError(error,"再設定メールを送信できませんでした");
    if (submit) submit.disabled=false;
  }
}
async function setNewPassword(e) {
  e.preventDefault();
  if (!state.supabase || !state.session?.user || !state.authRecovery) return toast("再設定リンクから開き直してください");
  const form=e.currentTarget;
  const data=new FormData(form);
  const password=String(data.get("password")||"");
  const confirm=String(data.get("password_confirm")||"");
  if (password.length<8) return toast("パスワードは8文字以上にしてください");
  if (password!==confirm) return toast("パスワードが一致しません");
  const submit=form.querySelector('button[type="submit"]');
  if (submit) submit.disabled=true;
  try {
    const {error}=await state.supabase.auth.updateUser({password});
    if (error) throw error;
    state.authRecovery=false;
    state.recoveryError="";
    const {error:logoutError}=await state.supabase.auth.signOut();
    if (logoutError) {
      console.warn("password changed but signout failed", logoutError);
      history.replaceState(null,"",`${location.pathname}#/dashboard`);
      render();
      toast("パスワードを変更しました。手動でログアウトしてください。");
      return;
    }
    state.session=null;
    state.profile=null;
    history.replaceState(null,"",`${location.pathname}#/login`);
    render();
    toast("パスワードを変更しました。新しいパスワードでログインしてください。");
  } catch(error) {
    dbError(error,"パスワードを変更できませんでした");
    if (submit) submit.disabled=false;
  }
}

function statusBadge(status, dictionary){return `<span class="status ${safeStatusClass(status)}">${localizedStatus(status,dictionary)}</span>`;}
function dashStat(value,label,tab,description="") {
  return `<button type="button" class="stat stat-link" data-dash-tab="${tab}" aria-label="${escapeHtml(label)}：${escapeHtml(value)}。詳細を見る"><strong>${escapeHtml(value)}</strong><span>${escapeHtml(label)}</span>${description?`<small class="stat-hint">${escapeHtml(description)}</small>`:""}</button>`;
}
function dashActivityRow(title,subtitle,status,dict,href="") {
  return `<div class="activity-row"><div class="activity-main">${href?`<a class="activity-title" href="${escapeHtml(href)}">${escapeHtml(title)}</a>`:`<span class="activity-title">${escapeHtml(title)}</span>`}<span class="activity-sub">${escapeHtml(subtitle)}</span></div>${status?statusBadge(status,dict):""}</div>`;

function dashActivityPanel(title,tab,items,empty) {

const VERIFY_BUCKET = "verification-documents";
const VERIFY_MAX_SIZE = 5 * 1024 * 1024; // 5 MB
const VERIFY_FORMATS = Object.freeze({
  "application/pdf": "pdf",
  "image/jpeg": "jpg",
  "image/png": "png"
});
const DOC_STATUS_LABELS = { pending:"審査待ち", approved:"承認済み", rejected:"却下", revoked:"認証取消" };
const VERIFICATION_RENEWAL_WINDOW_MS = 30 * 24 * 60 * 60 * 1000;
function verifiedDocumentValid(doc, at=Date.now()) {
  return doc?.status === "approved"
    && ["student_id", "university_email"].includes(doc.kind)
    && doc.expires_at
    && Number.isFinite(Date.parse(doc.expires_at))
    && Date.parse(doc.expires_at) > at;
}
function latestValidVerification(docs, at=Date.now()) {
  return (docs||[]).filter(d=>verifiedDocumentValid(d,at))
    .sort((a,b)=>Date.parse(b.expires_at)-Date.parse(a.expires_at))[0]||null;
}
function verificationRemainingDays(expiresAt, at=Date.now()) {
  return Math.max(0, Math.ceil((Date.parse(expiresAt)-at)/86400000));
}
function verificationDateJst(value) {
  if(!value || !Number.isFinite(Date.parse(value))) return "—";
  return new Intl.DateTimeFormat("ja-JP", {timeZone:"Asia/Tokyo", year:"numeric", month:"2-digit", day:"2-digit"}).format(new Date(value));
}
async function studentVerificationOverview(uid) {
  const {data, error}=await state.supabase.from("verification_documents")
    .select("kind,status,expires_at").eq("user_id",uid)
    .in("kind",["student_id","university_email"])
    .eq("status","approved")
    .order("expires_at",{ascending:false}).limit(50);
  if(error) return `<div class="notice error">認証期限を確認できません：${escapeHtml(error.message)}</div>`;
  const current=latestValidVerification(data||[]);
  if(!current) return `<div class="notice warn">学生認証は未確認または期限切れです。<button type="button" class="btn small" data-dash-tab="verification">学生証認証を確認する</button></div>`;
  const remaining=verificationRemainingDays(current.expires_at);
  return `<div class="notice ${remaining<=30?'warn':'success'}">学生認証の有効期限：<strong>${verificationDateJst(current.expires_at)}</strong>（残り約${remaining}日）${remaining<=30?'　更新可能です。':''} <button type="button" class="btn small" data-dash-tab="verification">${remaining<=30?'学生証を更新する':'認証情報を見る'}</button></div>`;
}

async function studentVerificationPanel(studentProfile, uid) {
  // Include university_email records when deciding whether verification is still valid.
  const {data:docs,error} = await state.supabase
    .from("verification_documents")
    .select("id,kind,status,review_note,created_at,reviewed_at,expires_at")
    .eq("user_id",uid)
    .in("kind",["student_id","university_email"])
    .order("created_at",{ascending:false})
    .limit(100);
  if(error) return `<div class="notice error">学生認証履歴を読み込めません：${escapeHtml(error.message)}</div>`;
  const records=docs||[];
  const current=latestValidVerification(records);
  const verified=!!current;
  const expiresAt=current?.expires_at || null;
  const remaining=verified?verificationRemainingDays(expiresAt):null;
  const canRenew=verified && Date.parse(expiresAt)-Date.now()<=VERIFICATION_RENEWAL_WINDOW_MS;
  const reviewing=records.some(d=>d.kind==="student_id" && d.status==="pending");
  const expired=records.some(d=>d.status==="approved" && d.expires_at && Date.parse(d.expires_at)<=Date.now());
  const revoked=records.some(d=>d.status==="revoked");
  const showUpload=!reviewing && (!verified || canRenew);
  const earliestRenewalDate=verified?verificationDateJst(new Date(Date.parse(expiresAt)-VERIFICATION_RENEWAL_WINDOW_MS).toISOString()):"";
  const history=records.length?`<div class="table-wrap"><table><thead><tr><th>提出日</th><th>書類</th><th>状態</th><th>有効期限</th><th>審査コメント</th></tr></thead><tbody>${records.map(d=>{
    const expiredRow=d.status==="approved" && d.expires_at && Date.parse(d.expires_at)<=Date.now();
    const statusLabel=expiredRow?"承認済み（期限切れ）":(DOC_STATUS_LABELS[d.status]||d.status);
    return `<tr><td>${fmtDate(d.created_at)}</td><td>${escapeHtml(d.kind==="student_id"?"学生証":"大学メール")}</td><td><span class="status ${escapeHtml(d.status)}">${escapeHtml(statusLabel)}</span></td><td>${d.expires_at?verificationDateJst(d.expires_at):"—"}</td><td>${escapeHtml(d.review_note||"—")}</td></tr>`;
  }).join("")}</tbody></table></div>`:`<div class="notice">学生証はまだ提出されていません。</div>`;
  return `<div class="panel" style="margin-bottom:14px"><div class="panel-head">学生証による本人確認</div><div class="panel-body">
    <div class="notice ${verified?(canRenew?'warn':'success'):reviewing?'warn':'error'}">現在の認証状態：<strong>${verified?'確認済み':reviewing?'審査中':'未確認'}</strong>${verified?`　有効期限：<strong>${verificationDateJst(expiresAt)}</strong>（残り約${remaining}日）`:''}</div>
    ${verified && !canRenew?`<div class="notice">認証は有効です。学生証は <strong>${earliestRenewalDate}</strong> から更新できます（期限30日前）。</div>`:""}
    ${verified && canRenew?`<div class="notice warn">認証期限まで約${remaining}日です。新しい学生証を提出できます。新しい書類が承認されるまで、現在の有効な認証は維持されます。</div>`:""}
    ${!verified && expired?`<div class="notice warn">以前の学生認証は期限切れです。新しい学生証を提出し、再認証を受けてください。プロフィール・応募履歴・スカウト履歴は削除されません。</div>`:""}
    ${revoked && !verified?`<div class="notice warn">過去の学生認証が取り消されています。提出履歴に記載された理由をご確認のうえ、新しい学生証を提出してください。</div>`:""}
    <p>学生証の画像またはPDFを提出してください。ファイルは非公開で保管し、運営管理者が審査します。</p>
    ${reviewing?`<div class="notice warn">学生証は審査待ちです。結果が出るまで追加提出はできません。</div>`:showUpload?`<form id="verification-upload-form">
      <div class="field"><label>${verified?'更新用の学生証':'学生証'}（PDF・JPEG・PNG、5MB以下）</label><input type="file" name="document" accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png" required></div>
      <div style="margin-top:12px"><button class="btn primary" type="submit">${verified?'新しい学生証を提出する':'学生証を提出する'}</button></div>
    </form>`:`<div class="notice success">現在は再提出する必要はありません。</div>`}
    <p class="form-help">住所・学籍番号など審査に不要な情報は隠して提出してください。氏名・大学名・有効期限は確認できるようにしてください。</p>
  </div></div><div class="toolbar"><h2>提出履歴</h2></div>${history}`;
}

async function adminVerificationPanel() {
  const {data:docs,error} = await state.supabase
    .from("verification_documents")
    .select("id,user_id,kind,storage_path,status,review_note,created_at,reviewed_at,expires_at")
    .eq("kind","student_id")
    .order("created_at",{ascending:false})
    .limit(200);
  if(error) return `<div class="notice error">審査書類を読み込めません：${escapeHtml(error.message)}</div>`;
  const records=docs||[];
  let names=new Map();
  if(records.length) {
    const ids=[...new Set(records.map(d=>d.user_id))];
    const {data:profiles,error:profileError}=await state.supabase.from("profiles")
      .select("id,display_name").in("id",ids);
    if(profileError) return `<div class="notice error">提出者情報を読み込めません：${escapeHtml(profileError.message)}</div>`;
    names=new Map((profiles||[]).map(p=>[p.id,p.display_name]));
  }
  const pending=records.filter(d=>d.status==="pending").length;
  const ordered=[...records].sort((a,b)=>(a.status==="pending"?0:1)-(b.status==="pending"?0:1));
  return `<div class="toolbar"><h2>学生証審査</h2><span class="result-summary">審査待ち ${pending} 件 / 全 ${records.length} 件（直近200件）</span></div>
    <div class="notice">書類は外部に公開されません。「書類を見る」で60秒間有効な閲覧URLを発行します。氏名・大学名などを確認してから判定してください。</div>
    ${ordered.length?`<div class="table-wrap"><table><thead><tr><th>提出者</th><th>提出日</th><th>状態</th><th>有効期限</th><th>書類</th><th>審査コメント</th><th>操作</th></tr></thead><tbody>${ordered.map(d=>`<tr><td>${escapeHtml(names.get(d.user_id)||d.user_id.slice(0,8))}</td><td>${fmtDate(d.created_at)}</td><td><span class="status ${escapeHtml(d.status)}">${escapeHtml(d.status==="approved" && d.expires_at && Date.parse(d.expires_at)<=Date.now()?"承認済み（期限切れ）":(DOC_STATUS_LABELS[d.status]||d.status))}</span></td><td>${d.expires_at?verificationDateJst(d.expires_at):"—"}</td><td><button type="button" class="btn small" data-verification-view="${escapeHtml(d.id)}">書類を見る</button></td><td>${escapeHtml(d.review_note||"—")}</td><td>${d.status==="pending"?`<div class="actions"><button type="button" class="btn small success" data-verification-review="${escapeHtml(d.id)}" data-approved="true">承認</button><button type="button" class="btn small danger" data-verification-review="${escapeHtml(d.id)}" data-approved="false">却下</button></div>`:d.status==="approved"?`<button type="button" class="btn small danger" data-verification-revoke="${escapeHtml(d.id)}">認証取消</button>`:"操作なし"}</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">学生証の提出はまだありません。</div>`}`;
}

async function uploadVerificationDocument(e) {
  e.preventDefault();
  const form=e.currentTarget;
  const button=form.querySelector('button[type="submit"]');
  if(!state.session?.user || state.profile?.role!=="student" || state.profile?.status!=="active") return toast("有効な学生アカウントでログインしてください");
  const file=new FormData(form).get("document");
  if(!(file instanceof File) || !file.size) return toast("ファイルを選択してください");
  const ext=VERIFY_FORMATS[file.type];
  if(!ext) return toast("PDF・JPEG・PNG形式のみ提出できます");
  if(file.size>VERIFY_MAX_SIZE) return toast("ファイルは5MB以下にしてください");
  const uid=state.session.user.id;
  // Check before uploading, since documents cannot be deleted by the client after upload.
  const {data:existingDocs,error:eligibilityError}=await state.supabase.from("verification_documents")
    .select("kind,status,expires_at").eq("user_id",uid)
    .in("kind",["student_id","university_email"]);
  if(eligibilityError) return dbError(eligibilityError,"提出可否を確認できませんでした");
  if((existingDocs||[]).some(d=>d.kind==="student_id"&&d.status==="pending")) return toast("審査待ちの学生証があります");
  const current=latestValidVerification(existingDocs||[]);
  if(current && Date.parse(current.expires_at)-Date.now()>VERIFICATION_RENEWAL_WINDOW_MS)
    return toast("更新は認証期限の30日前から可能です");
  const path=`${uid}/${crypto.randomUUID()}.${ext}`;
  if(button) button.disabled=true;
  let uploaded=false;
  try {
    const {error:uploadError}=await state.supabase.storage.from(VERIFY_BUCKET)
      .upload(path,file,{contentType:file.type,upsert:false});
    if(uploadError) throw uploadError;
    uploaded=true;
    const {error:insertError}=await state.supabase.from("verification_documents").insert({
      user_id:uid,kind:"student_id",storage_path:path,status:"pending"
    });
    if(insertError) throw insertError;
    toast("学生証を提出しました。審査をお待ちください");
    await render();
  } catch(error) {
    // Do not leave an unreferenced personal document in Storage when row insertion fails.
    if(uploaded){
      const {error:removeError}=await state.supabase.storage.from(VERIFY_BUCKET).remove([path]);
      if(removeError) console.error("Failed to clean up uploaded document",removeError);
    }
    dbError(error,"学生証を提出できませんでした");
  } finally {
    if(button) button.disabled=false;
  }
}

async function viewVerificationDocument(documentId) {
  // Open a blank tab on the click, before any asynchronous operations (popup blockers).
  const tab=window.open("about:blank","_blank");
  if(!tab) return toast("ポップアップを許可して、再度お試しください");
  tab.opener=null;
  try {
    const {data:doc,error:docError}=await state.supabase.from("verification_documents")
      .select("storage_path").eq("id",documentId).maybeSingle();
    if(docError) throw docError;
    if(!doc) throw new Error("書類が見つかりません");
    const {data,error}=await state.supabase.storage.from(VERIFY_BUCKET)
      .createSignedUrl(doc.storage_path,60);
    if(error) throw error;
    if(!data?.signedUrl) throw new Error("閲覧URLを発行できません");
    tab.location.href=data.signedUrl;
  } catch(error){
    tab.close();
    dbError(error,"書類を開けませんでした");
  }
}

async function reviewVerificationDocument(documentId,approved) {
  if(state.profile?.role!=="admin") return toast("管理者のみ審査できます");
  const note=approved?prompt("承認コメント（任意）",""):prompt("却下理由（学生に表示されます）を入力してください","");
  if(note===null) return;
  if(!approved && !note.trim()) return toast("却下理由を入力してください");
  const {error}=await state.supabase.rpc("admin_review_document",{
    p_document_id:documentId,p_approved:approved,p_note:note.trim()
  });
  if(error)return dbError(error,"審査結果を保存できませんでした");
  toast(approved?"学生証を承認しました":"学生証を却下しました");
  await render();
}

async function revokeVerificationDocument(documentId) {
  if(state.profile?.role!=="admin" || state.profile?.status!=="active") return toast("管理者のみ取消できます");
  const reason=prompt("認証取消の理由を入力してください（学生本人にも表示されます）","");
  if(reason===null) return;
  const trimmed=reason.trim();
  if(!trimmed || trimmed.length>1000) return toast("取消理由を1〜1000文字で入力してください");
  if(!confirm("この書類の承認を取り消します。学生の確認済み状態が解除される場合があります。実行しますか？")) return;
  const {error}=await state.supabase.rpc("admin_revoke_document",{
    p_document_id:documentId,p_reason:trimmed
  });
  if(error) return dbError(error,"認証を取り消せませんでした");
  toast("認証を取り消しました");
  await render();
}

// Verification renewal notifications are readable only by the current student via RLS.
const VERIFICATION_NOTIFICATION_LABELS = Object.freeze({
  renewal_30: "学生認証の更新受付が始まりました",
  renewal_7: "学生認証の有効期限が近づいています",
  expired: "学生認証の有効期限が切れました"
});
function notificationExpiryLabel(dateString) {
  if(!/^\d{4}-\d{2}-\d{2}$/.test(String(dateString || ""))) return "—";
  const [year, month, day] = String(dateString).split("-").map(Number);
  return `${year}年${month}月${day}日`;
}

// Matching notices are recipient-scoped by RLS. The joined history is also RLS protected.
function matchingNotificationMessage(history) {
  if(!history) return "応募・スカウトの状況が更新されました";
  if(history.application_id) {
    const messages={
      applied:"応募が登録されました", accepted:"応募が受付されました", rejected:"応募が見送られました",
      withdrawn:history.old_status==="applied"?"応募が取り消されました":"応募が辞退されました",
      visited:"見学段階に進みました", interview:"面接段階に進みました",
      offered:"内定が提示されました", closed:"選考が終了しました"
    };
    return messages[history.new_status] || "応募状況が更新されました";
  }
  const messages={
    read:"スカウトが既読になりました", interested:"学生がスカウトに興味ありと回答しました",
    declined:"学生がスカウトに興味なしと回答しました", cancelled:"病院がスカウトを取り消しました",
    withdrawn:"学生がスカウトを辞退しました", stopped:"病院が選考を中止しました"
  };
  return messages[history.new_status] || "スカウト状況が更新されました";
}
function matchingNotificationsPanel(rows, unreadCount, loadError, apps=[], scouts=[]) {
  const head=`<div class="toolbar"><h2>応募・スカウトのお知らせ</h2><span class="result-summary">未読 ${unreadCount} 件</span></div>`;
  if(loadError) return `${head}<div class="notice error">マッチング通知を取得できません：${escapeHtml(loadError.message || String(loadError))}</div>`;
  if(!rows.length) return `${head}<div class="empty">応募・スカウトの変更通知はまだありません。</div>`;
  const items=rows.map(n=>{
    const h=n.matching_status_history;
    if(!h) return "";
    const targetTab=h.application_id?"applications":"scouts";
    const a=h.application_id?apps.find(x=>x.id===h.application_id):null;
    const sc=h.scout_id?scouts.find(x=>x.id===h.scout_id):null;
    const subTitle=h.application_id
      ? `応募：${a?.job_postings?.title || "募集情報"}`
      : `スカウト：${sc?.hospitals?.name || sc?.profiles?.display_name || "スカウト情報"}`;
    return `<article class="panel matching-notice-item ${n.read_at?'':'matching-notice-unread'}">
      <div class="panel-head matching-notice-header"><span>${escapeHtml(matchingNotificationMessage(h))}</span><span class="tag ${n.read_at?'':'orange'}">${n.read_at?'既読':'未読'}</span></div>
      <div class="panel-body">
        <p class="matching-notice-context">${escapeHtml(subTitle)}　${statusBadge(h.new_status,h.application_id?APP_STATUS_LABELS:SCOUT_STATUS_LABELS)}</p>
        ${h.reason?`<p class="matching-notice-reason"><strong>理由：</strong>${escapeHtml(h.reason)}</p>`:""}
        <p class="form-help" style="margin:0 0 10px">通知日時：${fmtAuditTime(n.created_at)}</p>
        <div class="actions">${n.read_at?"":`<button type="button" class="btn small" data-matching-notification-read="${escapeHtml(n.id)}">既読にする</button>`}<button type="button" class="btn small primary" data-dash-tab="${targetTab}">${targetTab==="applications"?"応募履歴を見る":"スカウト履歴を見る"}</button></div>
      </div>
    </article>`;
  }).join("");
  return `${head}<div class="matching-notice-list">${items}</div><p class="form-help">最新100件を表示しています。既読にしても応募・スカウトの状態は変更されません。</p>`;
}
async function markMatchingNotificationRead(value) {
  const id=Number(value);
  if(!Number.isSafeInteger(id) || id<=0) return toast("通知IDが不正です");
  const {error}=await state.supabase.rpc("mark_matching_notification_read",{p_notification_id:id});
  if(error) return dbError(error,"お知らせを既読にできませんでした");
  await render();
}
function matchingNoticeRequests(uid,loadList) {
  return [
    loadList
      ? state.supabase.from("matching_notifications")
        .select("id,created_at,read_at,matching_status_history(id,application_id,scout_id,actor_user_id,old_status,new_status,action_type,reason,created_at)")
        .eq("recipient_user_id",uid).order("created_at",{ascending:false}).limit(100)
      : Promise.resolve({data:[],error:null}),
    state.supabase.from("matching_notifications")
      .select("id",{head:true,count:"exact"})
      .eq("recipient_user_id",uid).is("read_at",null)
  ];
}

async function studentDashboard() {
  const uid=state.session.user.id;
  const [spResult,appsResult,scoutsResult,notificationsResult,unreadResult,matchNotificationsResult,matchUnreadResult,matchingHistoryResult] = await Promise.all([
    state.supabase.from("student_profiles").select("*").eq("user_id",uid).maybeSingle(),
    state.supabase.from("applications").select("*,job_postings(id,title,hospitals(name))").eq("student_id",uid).order("created_at",{ascending:false}),
    state.supabase.from("scouts").select("*,hospitals(name)").eq("student_id",uid).order("created_at",{ascending:false}),
    state.supabase.from("verification_notifications").select("id,notification_type,expiry_date,created_at,read_at")
      .eq("user_id",uid).order("created_at",{ascending:false}).limit(100),
    state.supabase.from("verification_notifications").select("id",{head:true,count:"exact"})
      .eq("user_id",uid).is("read_at",null),
    ...matchingNoticeRequests(uid,state.activeDashTab==="notifications"),
    ["applications","scouts"].includes(state.activeDashTab)
      ? state.supabase.from("matching_status_history")
        .select("id,application_id,scout_id,actor_user_id,old_status,new_status,action_type,reason,created_at")
        .order("created_at",{ascending:false}).limit(200)
      : Promise.resolve({data:[],error:null})
  ]);
  const sp=spResult.data, apps=appsResult.data || [], scouts=scoutsResult.data || [];
  const noticeError=notificationsResult.error || unreadResult.error;
  const matchingNoticeError=matchNotificationsResult.error || matchUnreadResult.error;
  const unreadCount=noticeError?0:(unreadResult.count ?? 0);
  const matchingUnreadCount=matchingNoticeError?0:(matchUnreadResult.count ?? 0);
  const totalUnread=unreadCount+matchingUnreadCount;
  const allNoticesError=noticeError || matchingNoticeError;
  const notifications=notificationsResult.data || [];
  const matchNotifications=matchNotificationsResult.data || [];
  const histories=matchingHistoryResult.data || [];
  const nav=dashButton("overview","概要")+dashButton("profile","プロフィール")+dashButton("verification","学生証認証")+dashButton("notifications",!allNoticesError&&totalUnread?`お知らせ（${totalUnread}）`:"お知らせ")+dashButton("applications","応募管理")+dashButton("scouts","スカウト");
  let content="";
  if(state.activeDashTab==="overview") {
    const awaitingScout=scouts.filter(s=>["unread","read"].includes(s.status)).length;
    const recentApps=apps.slice(0,4).map(a=>dashActivityRow(
      a.job_postings?.title||"募集情報", `${a.job_postings?.hospitals?.name||"病院名未設定"} ・ 応募日 ${fmtDate(a.created_at)}`,
      a.status,APP_STATUS_LABELS,a.job_id?`#/jobs/${encodeURIComponent(a.job_id)}`:""));
    const recentScouts=scouts.slice(0,4).map(s=>dashActivityRow(
      s.hospitals?.name||"病院からのスカウト",`受信日 ${fmtDate(s.created_at)}`,
      s.status,SCOUT_STATUS_LABELS));
    content=`<div class="dash-welcome"><h3>医学生向けダッシュボード</h3><p>応募・スカウト・学生証認証の状況をまとめて確認できます。</p></div>
      <div class="stats">
        ${dashStat(appsResult.error?"—":apps.length,"応募件数","applications","履歴を見る")}
        ${dashStat(scoutsResult.error?"—":awaitingScout,"未回答のスカウト","scouts","回答を確認")}
        ${dashStat(allNoticesError?"—":totalUnread,"未読のお知らせ","notifications","通知を見る")}
        ${dashStat(spResult.error?"—":(sp?.scout_enabled?"公開中":"非公開"),"スカウト検索","profile","公開設定を変更")}
      </div>
      ${dashLoadError(spResult.error,"学生プロフィール")}${dashLoadError(appsResult.error,"応募履歴")}${dashLoadError(scoutsResult.error,"スカウト履歴")}${dashLoadError(noticeError,"学生認証のお知らせ")}${dashLoadError(matchingNoticeError,"応募・スカウトのお知らせ")}
      ${!allNoticesError && totalUnread?`<div class="notice warn">未読のお知らせが ${totalUnread} 件あります。<button type="button" class="btn small" data-dash-tab="notifications">確認する</button></div>`:""}
      ${await studentVerificationOverview(uid)}
      <div class="dash-actions"><a class="btn primary" href="#/jobs">募集を探す</a><button type="button" class="btn" data-dash-tab="profile">プロフィールを編集</button><button type="button" class="btn" data-dash-tab="verification">学生証認証を確認</button></div>
      <div class="dash-split">
        ${dashActivityPanel("最近の応募","applications",recentApps,"応募履歴はまだありません。")}
        ${dashActivityPanel("最近のスカウト","scouts",recentScouts,"受信したスカウトはまだありません。")}
      </div>`;
  }
  if(state.activeDashTab==="profile") content=dashLoadError(spResult.error,"学生プロフィール")||studentProfileForm(sp);
  if(state.activeDashTab==="verification") content=await studentVerificationPanel(sp,uid);
  if(state.activeDashTab==="notifications") content=`${matchingNotificationsPanel(matchNotifications,matchingUnreadCount,matchingNoticeError,apps,scouts)}<div class="divider"></div>${studentNotificationsPanel(notifications,unreadCount,noticeError)}`;
  if(state.activeDashTab==="applications") content=dashLoadError(appsResult.error,"応募履歴")||`${dashLoadError(matchingHistoryResult.error,"変更履歴")}${applicationsTable(apps,histories)}`;
  if(state.activeDashTab==="scouts") content=dashLoadError(scoutsResult.error,"スカウト履歴")||`${dashLoadError(matchingHistoryResult.error,"変更履歴")}${scoutsTable(scouts,histories)}`;
  return dashFrame(nav,content);
}

    <div class="field"><label><input style="width:auto" type="checkbox" name="name_visible" ${sp?.name_visible?"checked":""}> 検索結果で氏名を公開する</label></div>

function matchingHistoryPanel(targetId,kind,studentId,historyRows=[]){
  const col=kind==="application"?"application_id":"scout_id";
  const items=historyRows.filter(h=>h[col]===targetId);
  if(!items.length)return '<span class="form-help">—</span>';
  const labels=kind==="application"?APP_STATUS_LABELS:SCOUT_STATUS_LABELS;
  return `<details class="matching-history"><summary>変更履歴（${items.length}件）</summary><ul>${items.map(h=>{
    const actor=h.actor_user_id===studentId?"学生":"病院担当者";
    return `<li><strong>${localizedStatus(h.old_status,labels)} → ${localizedStatus(h.new_status,labels)}</strong><div class="form-help">${actor} ・ ${fmtAuditTime(h.created_at)}</div>${h.reason?`<div class="reason">理由：${escapeHtml(h.reason)}</div>`:""}</li>`;
  }).join("")}</ul></details>`;
}
function applicationsTable(rows,histories=[]){
  return `<div class="toolbar"><h2>応募管理</h2><a href="#/jobs" class="btn small">募集を探す</a></div>${rows.length ? `<div class="table-wrap"><table><thead><tr><th>募集</th><th>病院</th><th>応募日</th><th>状態</th><th>操作</th><th>変更履歴</th></tr></thead><tbody>${rows.map(r=>{
    const canWithdraw=["applied","accepted","visited","interview","offered"].includes(r.status);
    const label=r.status==="applied"?"応募取消":r.status==="offered"?"内定辞退":"応募辞退";
    return `<tr><td><a href="#/jobs/${encodeURIComponent(r.job_id)}">${escapeHtml(r.job_postings?.title||"募集情報")}</a></td><td>${escapeHtml(r.job_postings?.hospitals?.name||"—")}</td><td>${fmtDate(r.created_at)}</td><td>${statusBadge(r.status,APP_STATUS_LABELS)}</td><td class="matching-actions">${canWithdraw?`<button type="button" class="btn small" data-application-withdraw="${escapeHtml(r.id)}" data-action-label="${label}">${label}</button>`:"—"}</td><td>${matchingHistoryPanel(r.id,"application",r.student_id,histories)}</td></tr>`;
  }).join("")}</tbody></table></div>` : `<div class="empty">まだ応募はありません。<div style="margin-top:10px"><a class="btn primary" href="#/jobs">募集を探す</a></div></div>`}`;
}
function scoutsTable(rows,histories=[]){
  return `<div class="toolbar"><h2>受信したスカウト</h2><span class="result-summary">${rows.length} 件</span></div>${rows.length?`<div class="table-wrap"><table><thead><tr><th>病院</th><th>メッセージ</th><th>受信日</th><th>状態</th><th>回答・辞退</th><th>変更履歴</th></tr></thead><tbody>${rows.map(r=>{
    const actions=["unread","read"].includes(r.status)
      ? `<div class="actions"><button type="button" class="btn small success" data-scout-action="interested" data-id="${escapeHtml(r.id)}">興味あり</button><button type="button" class="btn small" data-scout-action="declined" data-id="${escapeHtml(r.id)}">興味なし</button></div>`
      : r.status==="interested"?`<button type="button" class="btn small" data-scout-withdraw="${escapeHtml(r.id)}">理由を入力して辞退</button>`:"—";
    return `<tr><td>${escapeHtml(r.hospitals?.name||"病院名未設定")}</td><td>${escapeHtml(r.message||"—")}</td><td>${fmtDate(r.created_at)}</td><td>${statusBadge(r.status,SCOUT_STATUS_LABELS)}</td><td class="matching-actions">${actions}</td><td>${matchingHistoryPanel(r.id,"scout",r.student_id,histories)}</td></tr>`;
  }).join("")}</tbody></table></div>`:`<div class="empty">スカウトはまだありません。プロフィールからスカウト検索の公開設定を確認できます。<div style="margin-top:10px"><button type="button" class="btn" data-dash-tab="profile">公開設定を確認</button></div></div>`}`;
}

async function hospitalDashboard() {
  const uid=state.session.user.id;
  const {data:members,error:memberError}=await state.supabase.from("hospital_members").select("hospital_id,member_role,hospitals(*)").eq("user_id",uid).limit(1);
  if(memberError) return dashFrame(dashButton("overview","病院登録"),dashLoadError(memberError,"病院情報"));

  if(!hospital) {
    const nav=dashButton("overview","病院登録");
    const content=`<div class="notice warn">病院情報がまだ登録されていません。最初に病院情報を登録してください。登録後、運営の確認が完了すると学生検索・スカウトが利用できます。</div>${hospitalCreateForm()}`;

      .select("*,job_postings!inner(id,title,hospital_id),profiles!applications_student_id_fkey(display_name,student_profiles(university,graduation_year))")
      .eq("job_postings.hospital_id",hid)
      .order("created_at",{ascending:false}),
    state.supabase.from("scouts")
      .select("*,profiles!scouts_student_id_fkey(display_name,student_profiles(university,graduation_year))")
      .eq("hospital_id",hid)
      .order("created_at",{ascending:false}),
    ...matchingNoticeRequests(uid,state.activeDashTab==="notifications"),
    ["applications","scouts"].includes(state.activeDashTab)
      ? state.supabase.from("matching_status_history")
        .select("id,application_id,scout_id,actor_user_id,old_status,new_status,action_type,reason,created_at")

  let content="";

    const openJobs=jobs.filter(j=>j.status==="published").length;
    const newApps=apps.filter(a=>a.status==="applied").length;
    const interested=scouts.filter(sc=>sc.status==="interested").length;
    const recentApps=apps.slice(0,4).map(a=>dashActivityRow(
      a.profiles?.display_name||"学生",`${a.job_postings?.title||"募集情報"} ・ 応募日 ${fmtDate(a.created_at)}`,
      a.status,APP_STATUS_LABELS));
    const recentJobs=jobs.slice(0,4).map(j=>dashActivityRow(
      j.title||"募集",`${jobKindLabel(j.kind)} ・ 作成日 ${fmtDate(j.created_at)}`,
      j.status,JOB_STATUS_LABELS));
    content=`<div class="dash-welcome"><h3>${escapeHtml(hospital.name)}</h3><p>募集掲載・応募者対応・スカウト状況をまとめて管理できます。</p></div>
      <div class="notice ${hospital.status==='verified'?'success':'warn'}">病院確認状態：<strong>${localizedStatus(hospital.status,HOSPITAL_STATUS_LABELS)}</strong>${hospital.status!=='verified'?" — 運営承認後に学生検索・スカウト機能が利用できます。":""}</div>

      ${!matchingNoticeError && matchingUnreadCount?`<div class="notice warn">応募・スカウトに関する未読のお知らせが ${matchingUnreadCount} 件あります。<button type="button" class="btn small" data-dash-tab="notifications">確認する</button></div>`:""}
      <div class="dash-actions"><button type="button" class="btn primary" data-dash-tab="jobs">募集を管理する</button><button type="button" class="btn" data-dash-tab="applications">応募者を確認</button>${hospital.status==='verified'?'<button type="button" class="btn" data-dash-tab="students">学生を検索</button>':''}</div>
      <div class="dash-split">
        ${dashActivityPanel("最近の応募","applications",recentApps,"応募者はまだいません。")}
        ${dashActivityPanel("最近の募集","jobs",recentJobs,"募集はまだ登録されていません。")}
      </div>
      <section class="panel" style="margin-top:14px"><div class="panel-head">病院紹介</div><div class="panel-body">${escapeHtml(hospital.description||"病院紹介は未登録です。")}</div></section>`;

  if(state.activeDashTab==="scouts") content=dashLoadError(scoutsResult.error,"スカウト情報")||`${dashLoadError(matchingHistoryResult.error,"変更履歴")}${hospitalScouts(scouts,histories)}`;
  if(state.activeDashTab==="notifications") content=matchingNotificationsPanel(matchNotifications,matchingUnreadCount,matchingNoticeError,apps,scouts);
  return dashFrame(nav,content);
}

function jobsManager(rows){return `<div class="toolbar"><h2>募集管理</h2><button class="btn primary small" id="new-job-toggle">新しい募集を作成</button></div><div id="new-job-area" hidden>${jobCreateForm()}</div>${rows.length?`<div class="table-wrap"><table><thead><tr><th>募集名</th><th>区分</th><th>対象卒業年</th><th>募集人数</th><th>応募締切</th><th>状態</th><th>操作</th></tr></thead><tbody>${rows.map(r=>`<tr><td><a href="#/jobs/${encodeURIComponent(r.id)}">${escapeHtml(r.title)}</a></td><td>${escapeHtml(jobKindLabel(r.kind))}</td><td>${escapeHtml(r.graduation_year||"—")}</td><td>${jobCapacityLabel(r.capacity)}</td><td>${jobDeadlineLabel(r.application_deadline)}${jobDeadlineExpired(r.application_deadline)?'（締切済み）':''}</td><td>${statusBadge(r.status,JOB_STATUS_LABELS)}</td><td><div class="actions"><button type="button" class="btn small" data-job-edit="${escapeHtml(r.id)}">編集</button>${r.status==='draft'?`<button class="btn small success" data-job-status="published" data-id="${escapeHtml(r.id)}">公開</button>`:r.status==='published'?`<button class="btn small" data-job-status="closed" data-id="${escapeHtml(r.id)}">終了</button>`:""}</div></td></tr><tr data-job-edit-panel="${escapeHtml(r.id)}" hidden><td colspan="7">${jobEditForm(r)}</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">まだ募集がありません。</div>`}`}

function jobEditForm(r){return `<div class="panel"><div class="panel-head">募集情報の編集</div><div class="panel-body"><form data-job-edit-form="${escapeHtml(r.id)}" class="form-grid"><div class="field span2"><label>募集名</label><input name="title" value="${escapeHtml(r.title||'')}" required></div><div class="field"><label>募集区分</label><select name="kind" required>${jobKindOptions(r.kind,'選択してください')}</select></div><div class="field"><label>対象卒業年</label><input type="number" name="graduation_year" min="2026" max="2040" value="${escapeHtml(r.graduation_year??'')}"></div><div class="field"><label>募集人数（任意）</label><input type="number" name="capacity" min="1" step="1" value="${escapeHtml(r.capacity??'')}"></div><div class="field"><label>応募締切（任意・日本時間）</label><input type="date" name="application_deadline" value="${escapeHtml(r.application_deadline||'')}"></div><div class="field span2"><label>募集内容</label><textarea name="description" required>${escapeHtml(r.description||'')}</textarea></div><p class="form-help span2">公開済みの募集も編集できます。締切を過ぎた募集は応募できません。募集人数は応募人数の上限ではありません。</p><div class="span2 actions"><button class="btn primary" type="submit">変更を保存</button><button type="button" class="btn" data-job-edit-cancel="${escapeHtml(r.id)}">キャンセル</button></div></form></div></div>`}
function relatedStudentProfile(profile){
  const sp=profile?.student_profiles;
  return Array.isArray(sp) ? (sp[0] || null) : (sp || null);
}
function hospitalApplications(rows,histories=[]){
  return rows.length?`<div class="table-wrap"><table><thead><tr><th>学生</th><th>操作</th><th>大学</th><th>募集</th><th>応募日</th><th>状態</th><th>変更履歴</th></tr></thead><tbody>${rows.map(r=>{
    const sp=relatedStudentProfile(r.profiles);
    const canAccept=r.status==="applied";
    const canReject=["applied","accepted","visited","interview"].includes(r.status);
    const actions=`${canAccept?`<button type="button" class="btn small success" data-application-status="accepted" data-id="${escapeHtml(r.id)}">受付</button>`:""}${canReject?`<button type="button" class="btn small danger" data-application-status="rejected" data-id="${escapeHtml(r.id)}">見送り</button>`:""}`;
    return `<tr><td>${escapeHtml(r.profiles?.display_name||"学生")}</td><td class="matching-actions"><div class="actions">${actions||"—"}</div></td><td>${escapeHtml(sp?.university||"—")}</td><td>${escapeHtml(r.job_postings?.title||"")}</td><td>${fmtDate(r.created_at)}</td><td>${statusBadge(r.status,APP_STATUS_LABELS)}</td><td>${matchingHistoryPanel(r.id,"application",r.student_id,histories)}</td></tr>`;
  }).join("")}</tbody></table></div>`:`<div class="empty">応募はまだありません。</div>`;
}

async function studentSearchPanel(hospital){
  if(hospital.status!=="verified") return `<div class="notice warn">病院確認が完了すると学生検索を利用できます。</div>`;

  const f=state.studentSearchFilters;
  const {data:students,error}=await state.supabase.rpc("search_students",{
    p_hospital_id:hospital.id,
    p_graduation_year:f.graduationYear?Number(f.graduationYear):null,
    p_area:f.area||null,
    p_specialty:f.specialty||null,
    p_university:f.university?.trim()||null
  });

  if(error) return `<div class="notice error">学生情報を取得できません：${escapeHtml(error.message)}</div>`;

  const searchForm=`<form id="student-search-form" class="search-panel" style="margin-top:0;margin-bottom:14px">
    <div class="search-title">学生を検索</div>
    <div class="search-grid">
      <div class="field"><label>卒業予定年</label><input type="number" name="graduation_year" min="2026" max="2040" value="${escapeHtml(f.graduationYear)}" placeholder="例：2028"></div>
      <div class="field"><label>希望地域</label><select name="area">${optionList(PREFECTURES,f.area,"すべて")}</select></div>
      <div class="field"><label>希望診療科</label><select name="specialty">${optionList(SPECIALTIES,f.specialty,"すべて")}</select></div>
      <div class="field"><label>大学</label><input name="university" value="${escapeHtml(f.university)}" placeholder="完全一致"></div>
    </div>
    <div class="search-actions"><button type="button" id="student-search-reset" class="btn">条件をクリア</button><button class="btn primary" type="submit">検索する</button></div>
  </form>`;

  const table=students?.length?`<div class="table-wrap"><table><thead><tr><th>学生</th><th>大学</th><th>学年</th><th>卒業予定</th><th>希望診療科</th><th>希望地域</th><th>確認</th><th></th></tr></thead><tbody>${students.map(s=>`<tr><td>${escapeHtml(s.display_name||s.public_code||"学生")}</td><td>${escapeHtml(s.university||"非公開")}</td><td>${escapeHtml(s.school_year||"—")}</td><td>${escapeHtml(s.graduation_year||"—")}</td><td>${escapeHtml((s.specialty_preferences||[]).join(" / ")||"—")}</td><td>${escapeHtml((s.preferred_areas||[]).join(" / ")||"—")}</td><td>${s.verified?'<span class="status verified">確認済み</span>':'未確認'}</td><td><button class="btn small secondary" data-scout-student="${s.user_id}">スカウト</button></td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">条件に一致する、スカウト受付中の学生はいません。</div>`;

  return `${searchForm}<div class="toolbar"><h2>学生検索</h2><span class="result-summary">${students?.length||0} 名</span></div>${table}`;
}
function hospitalScouts(rows,histories=[]){
  return rows.length?`<div class="table-wrap"><table><thead><tr><th>学生</th><th>大学</th><th>メッセージ</th><th>送信日</th><th>状態</th><th>操作</th><th>変更履歴</th></tr></thead><tbody>${rows.map(r=>{
    const sp=relatedStudentProfile(r.profiles);

      r.status==="interested"?`<button type="button" class="btn small danger" data-hospital-close-scout="${escapeHtml(r.id)}" data-action-label="選考中止">選考中止</button>`:"—";
    return `<tr><td>${escapeHtml(r.profiles?.display_name||"学生")}</td><td>${escapeHtml(sp?.university||"—")}</td><td>${escapeHtml(r.message||"")}</td><td>${fmtDate(r.created_at)}</td><td>${statusBadge(r.status,SCOUT_STATUS_LABELS)}</td><td class="matching-actions">${action}</td><td>${matchingHistoryPanel(r.id,"scout",r.student_id,histories)}</td></tr>`;

}

const AUDIT_ACTION_LABELS = {
  document_submitted: "書類提出",
  document_approved: "承認",
  document_rejected: "却下",
  document_revoked: "認証取消",
  document_updated: "書類更新",
  document_deleted: "書類削除",
  insert: "旧形式：登録",
  update: "旧形式：更新",
  delete: "旧形式：削除"
};

async function adminAuditHistoryPanel(visibleProfiles = [], visibleHospitals = []) {
  const {data, error} = await state.supabase
    .from("audit_logs")
    .select("id,actor_user_id,action,entity_id,detail,created_at")
    .eq("entity_type", "verification_documents")
    .order("id", {ascending: false})
    .limit(200);

  if (error) {
    return `<div class="notice error">審査履歴を取得できません：${escapeHtml(error.message)}</div>`;
  }

  const logs = data || [];
  const names = new Map(visibleProfiles.map(p => [p.id, p.display_name]));
  const displayUser = (id) => id ? escapeHtml(names.get(id) || String(id).slice(0,8) + "…") : "不明";
  const displayStatus = (status) => status == null ? "—" : escapeHtml(DOC_STATUS_LABELS[status] || status);

  const studentHistory = `<div class="toolbar"><h2>学生証の審査履歴</h2><span class="result-summary">直近 ${logs.length} 件（最大200件）</span></div>
    <div class="notice">操作時刻は日本時間です。旧形式の履歴には、変更前後の状態・審査理由が保存されていません。</div>
    ${logs.length ? `<div class="table-wrap"><table><thead><tr>
      <th>操作日時（JST）</th><th>操作</th><th>操作した人</th><th>提出者</th><th>状態変更</th><th>審査理由・コメント</th><th>書類ID</th>
    </tr></thead><tbody>${logs.map(r => {
      const d = r.detail && typeof r.detail === "object" ? r.detail : {};
      const hasStatus = Object.prototype.hasOwnProperty.call(d, "status_after");
      const statusChange = hasStatus
        ? `${displayStatus(d.status_before)} → ${displayStatus(d.status_after)}`
        : "旧形式（記録なし）";
      const note = d.review_note_after == null || d.review_note_after === ""
        ? "—"
        : escapeHtml(d.review_note_after);
      return `<tr>
        <td>${fmtAuditTime(r.created_at)}</td>
        <td>${escapeHtml(AUDIT_ACTION_LABELS[r.action] || r.action)}</td>
        <td>${displayUser(r.actor_user_id)}</td>
        <td>${displayUser(d.student_id)}</td>
        <td>${statusChange}</td>
        <td>${note}</td>
        <td title="${escapeHtml(r.entity_id || "")}">${escapeHtml((r.entity_id || "").slice(0,8))}…</td>
      </tr>`;
    }).join("")}</tbody></table></div>` : `<div class="empty">審査履歴はまだありません。</div>`}`;

  // 病院の監査ログは学生証の履歴とは別に取得し、既存の一覧を維持する。
  const {data: hospitalRows, error: hospitalError} = await state.supabase
    .from("audit_logs")
    .select("id,actor_user_id,action,entity_id,detail,created_at")
    .eq("entity_type", "hospitals")
    .order("id", {ascending: false})
    .limit(200);

  if (hospitalError) {
    return `${studentHistory}<div class="section-head"><h2>病院の承認・変更履歴</h2></div>
      <div class="notice error">病院の履歴を取得できません：${escapeHtml(hospitalError.message)}</div>`;
  }

  const hospitalNames = new Map(visibleHospitals.map(h => [h.id, h.name]));
  const hospitalLogs = hospitalRows || [];
  const hospitalHistory = `<div class="section-head"><h2>病院の承認・変更履歴</h2>
      <p>直近 ${hospitalLogs.length} 件（最大200件）</p></div>
    <div class="notice">新しい監査形式では承認状態の変更前後を表示します。旧形式の履歴には変更内容が保存されていません。</div>
    ${hospitalLogs.length ? `<div class="table-wrap"><table><thead><tr>
      <th>操作日時（JST）</th><th>操作</th><th>操作した人</th><th>病院</th><th>承認状態の変更</th><th>病院ID</th>
    </tr></thead><tbody>${hospitalLogs.map(r => {
      const d = r.detail && typeof r.detail === "object" && !Array.isArray(r.detail) ? r.detail : {};
      const isDetailed = Object.prototype.hasOwnProperty.call(d, "old_status") || Object.prototype.hasOwnProperty.call(d, "new_status");
      const statusLabel = value => value == null ? "—" : escapeHtml(HOSPITAL_STATUS_LABELS[value] || value);
      const change = isDetailed
        ? `${statusLabel(d.old_status)} → ${statusLabel(d.new_status)}`
        : "旧形式（詳細記録なし）";
      const hospitalId = String(r.entity_id || "");
      return `<tr>
        <td>${fmtAuditTime(r.created_at)}</td>
        <td>${escapeHtml(({insert:"登録",update:"更新",delete:"削除"})[r.action] || AUDIT_ACTION_LABELS[r.action] || r.action)}</td>
        <td>${displayUser(r.actor_user_id)}</td>
        <td>${escapeHtml(hospitalNames.get(hospitalId) || "病院名不明")}</td>
        <td>${change}</td>
        <td title="${escapeHtml(hospitalId)}">${escapeHtml(hospitalId.slice(0,8))}…</td>
      </tr>`;
    }).join("")}</tbody></table></div>` : `<div class="empty">病院の操作履歴はまだありません。</div>`}`;

  return studentHistory + hospitalHistory;
}

async function adminDashboard() {
  if(state.profile?.role!=="admin") return shellMessage("運営管理","管理者権限がありません。");
  const [{data:hospitals},{data:profiles}] = await Promise.all([
    state.supabase.from("hospitals").select("*").order("created_at",{ascending:false}),
    state.supabase.from("profiles").select("id,display_name,role,status,created_at").order("created_at",{ascending:false}).limit(200)
  ]);
  const nav=dashButton("overview","概要")+dashButton("hospitals","病院審査")+dashButton("documents","学生認証")+dashButton("audit","審査履歴")+dashButton("users","ユーザー管理");
  const pending=(hospitals||[]).filter(h=>h.status==="pending").length;
  let content="";
  if(state.activeDashTab==="overview") content=`<div class="stats"><div class="stat"><strong>${pending}</strong><span>病院審査待ち</span></div><div class="stat"><strong>${hospitals?.length||0}</strong><span>病院</span></div><div class="stat"><strong>${profiles?.length||0}</strong><span>ユーザー</span></div></div><div class="notice">病院審査では公式サイト・所在地・担当者所属を確認してから承認してください。</div>`;
  if(state.activeDashTab==="hospitals") content=adminHospitals(hospitals||[]);
  if(state.activeDashTab==="documents") content=await adminVerificationPanel();
  if(state.activeDashTab==="audit") content=await adminAuditHistoryPanel(profiles||[],hospitals||[]);
  if(state.activeDashTab==="users") content=adminUsers(profiles||[]);
  return dashFrame(nav,content);
}
function adminHospitals(rows){
  const sorted=[...rows].sort((a,b)=>Number(b.status==="pending")-Number(a.status==="pending"));
  return `<div class="toolbar"><h2>病院審査</h2><span class="result-summary">${rows.length} 件</span></div>${sorted.length?`<div class="table-wrap"><table><thead><tr><th>病院名</th><th>所在地</th><th>Web</th><th>状態</th><th>登録日</th><th></th></tr></thead><tbody>${sorted.map(h=>`<tr><td>${escapeHtml(h.name)}</td><td>${escapeHtml([h.prefecture,h.city].filter(Boolean).join(" "))}</td><td>${h.website?`<a href="${escapeHtml(h.website)}" target="_blank" rel="noopener noreferrer">確認</a>`:"—"}</td><td>${statusBadge(h.status,HOSPITAL_STATUS_LABELS)}</td><td>${fmtDate(h.created_at)}</td><td><div class="actions">${h.status!=="verified"?`<button class="btn small success" data-hospital-verify="verified" data-id="${h.id}">${h.status==="rejected"?"再承認":"承認"}</button>`:""}${h.status!=="rejected"?`<button class="btn small danger" data-hospital-verify="rejected" data-id="${h.id}">却下</button>`:""}</div></td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">病院登録はありません。</div>`}`;
}
function adminUsers(rows){
  return `<div class="toolbar"><h2>ユーザー管理</h2><span class="result-summary">${rows.length} 件</span></div><div class="table-wrap"><table><thead><tr><th>表示名</th><th>種別</th><th>状態</th><th>登録日</th><th></th></tr></thead><tbody>${rows.map(p=>`<tr><td>${escapeHtml(p.display_name||"—")}</td><td>${localizedStatus(p.role,PROFILE_ROLE_LABELS)}</td><td>${statusBadge(p.status,PROFILE_STATUS_LABELS)}</td><td>${fmtDate(p.created_at)}</td><td>${p.role!=="admin"?`<button class="btn small ${p.status==='active'?'danger':'success'}" data-user-status="${p.status==='active'?'suspended':'active'}" data-id="${p.id}">${p.status==='active'?'停止':'有効化'}</button>`:"—"}</td></tr>`).join("")}</tbody></table></div>`;
}
function aboutPage(){return `${header("")}<main class="page"><div class="breadcrumbs"><a href="#/">トップ</a> &gt; MedMatchについて</div><div class="detail-main"><h1 class="detail-title">MedMatchについて</h1><section class="detail-section"><h2>目的</h2><p>医学生が病院の募集を探して応募でき、確認済み病院が公開プロフィールから学生を検索してスカウトできる、双方向型のキャリア情報プラットフォームです。</p></section><section class="detail-section"><h2>主な機能</h2><p>募集検索・詳細閲覧、医学生プロフィール、応募管理、病院による募集掲載・学生検索・スカウト、運営による病院審査・アカウント管理を備えています。</p></section></div></main>${footer()}`}

async function render() {
  state.route=parseRoute();
  let html="";
  try {
    if(state.route.name==="home") html=homePage();
    else if(state.route.name==="jobs" && state.route.parts.length===1) html=jobsPage();
    else if(state.route.name==="jobs" && state.route.parts[1]) html=await jobDetailPage(state.route.parts[1]);
    else if(state.route.name==="hospitals" && state.route.parts[1]) html=await hospitalDetailPage(state.route.parts[1]);
    else if(state.route.name==="login") html=loginPage();
    else if(state.route.name==="forgot-password") html=forgotPasswordPage();
    else if(state.route.name==="reset-password") html=resetPasswordPage();
    else if(state.route.name==="register") html=registerPage();
    else if(state.route.name==="dashboard") html=await dashboardPage();
    else if(state.route.name==="admin") { html=await adminDashboard(); }
    else if(state.route.name==="about") html=aboutPage();
    else html=shellMessage("ページが見つかりません","指定されたページは存在しません。");
  } catch(error) {
    console.error(error);
    html=`${header("")}<main class="page"><div class="notice error"><strong>画面の読み込み中にエラーが発生しました。</strong><br>${escapeHtml(error?.message||String(error))}</div><p><a href="#/">トップへ戻る</a></p></main>${footer()}`;
  }
  root.innerHTML=html;
  bindEvents();
}

function bindEvents() {
  document.getElementById("search-form")?.addEventListener("submit", e=>{e.preventDefault();const f=new FormData(e.currentTarget);state.filters={keyword:f.get("keyword")||"",prefecture:f.get("prefecture")||"",specialty:f.get("specialty")||"",jobType:f.get("jobType")||""};if(state.route.name!=="jobs") location.hash="#/jobs"; else render();});
  document.getElementById("search-reset")?.addEventListener("click",()=>{state.filters={keyword:"",prefecture:"",specialty:"",jobType:""};render();});
  document.querySelectorAll("[data-filter]").forEach(el=>el.addEventListener("change",()=>{state.filters[el.dataset.filter]=el.value;render();}));
  document.getElementById("login-form")?.addEventListener("submit",handleLogin);
  document.getElementById("forgot-password-form")?.addEventListener("submit",sendPasswordReset);
  document.getElementById("reset-password-form")?.addEventListener("submit",setNewPassword);
  document.getElementById("register-form")?.addEventListener("submit",handleRegister);
  document.getElementById("logout-btn")?.addEventListener("click",handleLogout);
  document.querySelectorAll("[data-dash-tab]").forEach(b=>b.addEventListener("click",()=>{state.activeDashTab=b.dataset.dashTab;render();}));
  document.getElementById("student-profile-form")?.addEventListener("submit",saveStudentProfile);
  document.querySelectorAll("[data-verification-notification-read]").forEach(b=>b.addEventListener("click",()=>markVerificationNotificationRead(b.dataset.verificationNotificationRead)));
  document.querySelectorAll("[data-matching-notification-read]").forEach(b=>b.addEventListener("click",()=>markMatchingNotificationRead(b.dataset.matchingNotificationRead)));
  document.getElementById("verification-upload-form")?.addEventListener("submit",uploadVerificationDocument);
  document.querySelectorAll("[data-verification-view]").forEach(b=>b.addEventListener("click",()=>viewVerificationDocument(b.dataset.verificationView)));
  document.querySelectorAll("[data-verification-review]").forEach(b=>b.addEventListener("click",()=>reviewVerificationDocument(b.dataset.verificationReview,b.dataset.approved==="true")));
  document.querySelectorAll("[data-verification-revoke]").forEach(b=>b.addEventListener("click",()=>revokeVerificationDocument(b.dataset.verificationRevoke)));
  document.getElementById("student-search-form")?.addEventListener("submit",e=>{e.preventDefault();const f=new FormData(e.currentTarget);state.studentSearchFilters={graduationYear:f.get("graduation_year")||"",area:f.get("area")||"",specialty:f.get("specialty")||"",university:f.get("university")||""};render();});
  document.getElementById("student-search-reset")?.addEventListener("click",()=>{state.studentSearchFilters={graduationYear:"",area:"",specialty:"",university:""};render();});
  document.getElementById("hospital-create-form")?.addEventListener("submit",createHospital);
  document.getElementById("new-job-toggle")?.addEventListener("click",()=>{const a=document.getElementById("new-job-area");a.hidden=!a.hidden;});
  document.getElementById("job-create-form")?.addEventListener("submit",createJob);
  document.querySelectorAll("[data-job-edit]").forEach(b=>b.addEventListener("click",()=>{
    const panel=b.closest("tr")?.nextElementSibling;
    const opening=!!panel?.hidden;
    document.querySelectorAll("[data-job-edit-panel]").forEach(x=>{x.hidden=true;});
    if(panel) panel.hidden=!opening;
  }));
  document.querySelectorAll("[data-job-edit-cancel]").forEach(b=>b.addEventListener("click",()=>{const panel=b.closest("[data-job-edit-panel]");if(panel)panel.hidden=true;}));
  document.querySelectorAll("[data-job-edit-form]").forEach(form=>form.addEventListener("submit",updateJob));
  document.getElementById("apply-job")?.addEventListener("click",applyJob);
  document.querySelectorAll("[data-job-status]").forEach(b=>b.addEventListener("click",()=>updateJobStatus(b.dataset.id,b.dataset.jobStatus)));
  document.querySelectorAll("[data-application-status]").forEach(b=>b.addEventListener("click",()=>updateApplicationStatus(b.dataset.id,b.dataset.applicationStatus)));
  document.querySelectorAll("[data-application-withdraw]").forEach(b=>b.addEventListener("click",()=>withdrawApplication(b.dataset.applicationWithdraw,b.dataset.actionLabel)));
  document.querySelectorAll("[data-scout-action]").forEach(b=>b.addEventListener("click",()=>updateScoutStatus(b.dataset.id,b.dataset.scoutAction)));
  document.querySelectorAll("[data-scout-withdraw]").forEach(b=>b.addEventListener("click",()=>withdrawFromScout(b.dataset.scoutWithdraw)));
  document.querySelectorAll("[data-hospital-close-scout]").forEach(b=>b.addEventListener("click",()=>hospitalCloseScout(b.dataset.hospitalCloseScout,b.dataset.actionLabel)));
  document.querySelectorAll("[data-scout-student]").forEach(b=>b.addEventListener("click",()=>sendScout(b.dataset.scoutStudent)));
  document.querySelectorAll("[data-hospital-verify]").forEach(b=>b.addEventListener("click",()=>verifyHospital(b.dataset.id,b.dataset.hospitalVerify)));
  document.querySelectorAll("[data-user-status]").forEach(b=>b.addEventListener("click",()=>updateUserStatus(b.dataset.id,b.dataset.userStatus)));
}

async function handleLogin(e){e.preventDefault();if(!state.supabase)return toast("Supabaseに接続できていません");const f=new FormData(e.currentTarget);const {error}=await state.supabase.auth.signInWithPassword({email:f.get("email"),password:f.get("password")});if(error)return dbError(error);toast("ログインしました");location.hash="#/dashboard";}
async function handleRegister(e){e.preventDefault();if(!state.supabase)return toast("Supabaseに接続できていません");const f=new FormData(e.currentTarget);const {data,error}=await state.supabase.auth.signUp({email:f.get("email"),password:f.get("password"),options:{data:{role:f.get("role"),display_name:f.get("display_name")}}});if(error)return dbError(error);toast(data.session?"登録しました":"確認メールを送信しました");if(data.session)location.hash="#/dashboard";else location.hash="#/login";}
async function handleLogout(){const {error}=await state.supabase.auth.signOut();if(error)return dbError(error);state.profile=null;state.activeDashTab="overview";location.hash="#/";}
function csvArray(v){return String(v||"").split(",").map(x=>x.trim()).filter(Boolean)}
async function saveStudentProfile(e){e.preventDefault();const f=new FormData(e.currentTarget);const payload={university:f.get("university")||"",school_year:f.get("school_year")?Number(f.get("school_year")):null,graduation_year:f.get("graduation_year")?Number(f.get("graduation_year")):null,specialty_preferences:csvArray(f.get("specialty_preferences")),preferred_areas:csvArray(f.get("preferred_areas")),bio:f.get("bio")||"",scout_enabled:f.get("scout_enabled")==="on",name_visible:f.get("name_visible")==="on",university_visible:f.get("university_visible")==="on",updated_at:new Date().toISOString()};const {data,error}=await state.supabase.from("student_profiles").update(payload).eq("user_id",state.session.user.id).select("user_id").maybeSingle();if(error)return dbError(error);if(!data)return toast("学生プロフィールが見つかりません");toast("プロフィールを保存しました");render();}
async function createHospital(e){e.preventDefault();const f=new FormData(e.currentTarget);const {data:h,error}=await state.supabase.from("hospitals").insert({name:f.get("name"),prefecture:f.get("prefecture"),city:f.get("city"),address:f.get("address"),hospital_type:f.get("hospital_type"),website:f.get("website")||"",description:f.get("description")||"",salary_text:f.get("salary_text")||"",oncall_text:f.get("oncall_text")||"",emergency_text:f.get("emergency_text")||"",status:"pending",created_by:state.session.user.id}).select().single();if(error)return dbError(error);const {error:me}=await state.supabase.from("hospital_members").insert({hospital_id:h.id,user_id:state.session.user.id,member_role:"owner"});if(me)return dbError(me);toast("病院情報を登録しました。運営確認待ちです。");render();}
async function currentHospitalId(){const {data}=await state.supabase.from("hospital_members").select("hospital_id").eq("user_id",state.session.user.id).limit(1).maybeSingle();return data?.hospital_id}
async function createJob(e){
  e.preventDefault();
  let fields;
  try { fields=jobFormValues(e.currentTarget); } catch(error) { return toast(error.message); }
  const hospital_id=await currentHospitalId();
  if(!hospital_id)return toast("病院情報を取得できません");
  const payload={...fields,hospital_id,status:"draft",created_by:state.session.user.id};
  const {error}=await state.supabase.from("job_postings").insert(payload);
  if(error)return dbError(error);
  toast("募集を下書き保存しました");state.activeDashTab="jobs";render();
}
async function updateJob(e){
  e.preventDefault();
  const id=e.currentTarget.dataset.jobEditForm;
  let fields;
  try { fields=jobFormValues(e.currentTarget); } catch(error) { return toast(error.message); }
  if(!id)return toast("募集IDを取得できません");
  const hospital_id=await currentHospitalId();
  if(!hospital_id)return toast("病院情報を取得できません");
  const {data,error}=await state.supabase.from("job_postings")
    .update({...fields,updated_at:new Date().toISOString()})
    .eq("id",id).eq("hospital_id",hospital_id).select("id").maybeSingle();
  if(error)return dbError(error);
  if(!data)return toast("募集を更新できません。所属病院と編集権限を確認してください。");
  toast("募集情報を更新しました");
  await loadPublicJobs();render();
}
async function updateJobStatus(id,status){
  if(status==="published"){
    const hospital_id=await currentHospitalId();
    if(!hospital_id)return toast("病院情報を取得できません");
    const {data,error}=await state.supabase.from("job_postings")
      .select("application_deadline").eq("id",id).eq("hospital_id",hospital_id).maybeSingle();
    if(error)return dbError(error);
    if(!data)return toast("募集が見つかりません");
    if(jobDeadlineExpired(data.application_deadline))return toast("応募締切が過ぎています。締切を変更してから公開してください。");
  }
  const patch={status,updated_at:new Date().toISOString()};
  if(status==="published")patch.published_at=new Date().toISOString();
  const {error}=await state.supabase.from("job_postings").update(patch).eq("id",id);
  if(error)return dbError(error);
  toast("募集状態を更新しました");await loadPublicJobs();render();
}
async function applyJob(){const id=document.getElementById("apply-job")?.dataset.id;if(!id)return;const message=prompt("応募メッセージ（任意）を入力してください。","");if(message===null)return;const {error}=await state.supabase.rpc("create_application",{p_job_id:id,p_message:message||""});if(error)return dbError(error);toast("応募しました");state.activeDashTab="applications";location.hash="#/dashboard";}
function askMatchingReason(label){
  const input=window.prompt(`${label}の理由を入力してください（必須・1～1000文字）。\n入力内容は相手にも公開され、履歴に残ります。`,"");
  if(input===null)return null;
  const reason=input.trim();
  if(reason.length<1 || reason.length>1000){toast("理由は1～1000文字で入力してください");return null;}
  return window.confirm(`${label}を確定します。変更履歴は削除できません。よろしいですか？`)?reason:null;
}
async function updateApplicationStatus(id,status){
  if(!["accepted","rejected"].includes(status))return toast("不正な状態変更です");
  const reason=status==="rejected"?askMatchingReason("見送り"):null;
  if(status==="rejected"&&reason===null)return;
  if(status==="accepted"&&!window.confirm("応募を受付済みにします。よろしいですか？"))return;
  const {error}=await state.supabase.rpc("hospital_change_application_status",{p_application_id:id,p_status:status,p_reason:reason});
  if(error)return dbError(error);toast(status==="accepted"?"応募を受付しました":"理由を記録して見送りました");render();
}
async function withdrawApplication(id,label){
  const reason=askMatchingReason(label||"応募辞退");if(reason===null)return;
  const {error}=await state.supabase.rpc("withdraw_application",{p_application_id:id,p_reason:reason});
  if(error)return dbError(error);toast("応募の取消・辞退を記録しました");render();
}
async function updateScoutStatus(id,status){
  if(!["interested","declined"].includes(status))return toast("不正な回答です");
  if(!window.confirm(status==="interested"?"スカウトに興味ありと回答しますか？":"興味なしと回答しますか？"))return;
  const {error}=await state.supabase.rpc("respond_to_scout",{p_scout_id:id,p_status:status});
  if(error)return dbError(error);toast(status==="interested"?"興味ありとして回答しました":"興味なしと回答しました");render();
}
async function withdrawFromScout(id){
  const reason=askMatchingReason("スカウト辞退");if(reason===null)return;
  const {error}=await state.supabase.rpc("withdraw_from_scout",{p_scout_id:id,p_reason:reason});
  if(error)return dbError(error);toast("理由を記録して辞退しました");render();
}
async function hospitalCloseScout(id,label){
  const reason=askMatchingReason(label||"スカウト取消・選考中止");if(reason===null)return;
  const {error}=await state.supabase.rpc("hospital_close_scout",{p_scout_id:id,p_reason:reason});
  if(error)return dbError(error);toast("理由と変更履歴を保存しました");render();
}
async function sendScout(student_id){const hid=await currentHospitalId();if(!hid)return toast("病院情報を取得できません");const msg=prompt("学生へのスカウトメッセージを入力してください。","");if(msg===null||!msg.trim())return;const {error}=await state.supabase.from("scouts").insert({hospital_id:hid,student_id,sender_user_id:state.session.user.id,message:msg.trim()});if(error)return dbError(error);toast("スカウトを送信しました");state.activeDashTab="scouts";render();}
async function verifyHospital(id,status){
  if(state.profile?.role!=="admin" || state.profile?.status!=="active") return toast("管理者のみ操作できます");
  if(!["verified","rejected"].includes(status))return toast("無効な審査操作です");
  const approved=status==="verified";
  const message=approved
    ? "この病院を承認しますか？ 承認待ちの担当者のみ有効化され、停止中の担当者は停止のままです。"
    : "この病院を却下しますか？ 病院に所属する担当者のアカウントが停止されます。";
  if(!window.confirm(message))return;
  const {error}=await state.supabase.rpc("admin_verify_hospital",{
    p_hospital_id:id,
    p_approved:approved
  });
  if(error)return dbError(error);
  toast(approved?"病院を承認しました":"病院を却下しました");
  await render();
}
async function updateUserStatus(id,status){
  if(state.profile?.role!=="admin" || state.profile?.status!=="active")return toast("管理者のみ操作できます");
  if(!["active","suspended"].includes(status))return toast("無効な状態変更です");
  const message=status==="suspended"
    ? "このアカウントを停止しますか？ 対象ユーザーがサービスを利用できなくなります。"
    : "このアカウントを有効化しますか？ 本人確認・所属先の審査状況を確認してください。";
  if(!window.confirm(message))return;
  const {error}=await state.supabase.rpc("admin_set_profile_status",{
    p_user_id:id,
    p_status:status
  });
  if(error)return dbError(error);
  toast(status==="active"?"アカウントを有効化しました":"アカウントを停止しました");
  await render();
}

window.addEventListener("hashchange",()=>{state.activeDashTab="overview";render();});
window.addEventListener("error",e=>console.error("window error",e.error||e.message));
window.addEventListener("unhandledrejection",e=>console.error("unhandled rejection",e.reason));

init();

</script>
</body>
