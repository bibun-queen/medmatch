name: Deploy MedMatch to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Deploy only the files needed by the public website.
      - name: Prepare public site
        run: |
          mkdir -p _site
          cp index.html privacy.html terms.html styles.css config.js _site/
          touch _site/.nojekyll

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
